<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threadscape · AI 知识探索</title><style>body{margin:0;font-family:system-ui;background:#07111f;color:#eaf4ff}main{max-width:980px;margin:auto;padding:80px 24px}.tag{color:#7dd3fc}.hero{background:linear-gradient(135deg,#0e7490,#3730a3);padding:52px;border-radius:28px;box-shadow:0 25px 80px #0008}h1{font-size:clamp(44px,8vw,82px);margin:10px 0}p{font-size:19px;line-height:1.8;color:#d8e7f5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:28px 0}.card{background:#ffffff0d;border:1px solid #ffffff1f;padding:22px;border-radius:18px}.btn{display:inline-block;margin:8px 10px 0 0;padding:13px 22px;border-radius:999px;background:#fff;color:#172554;text-decoration:none;font-weight:700}.note{margin-top:28px;padding:18px;border-left:4px solid #38bdf8;background:#0c4a6e55}</style></head><body><main><section class="hero"><div class="tag">AI KNOWLEDGE EXPLORATION</div><h1>Threadscape</h1><p>把一次对话扩展成可继续探索的知识网络。项目支持流式对话、工具调用、多层知识树、任务队列与知识图谱。</p><div class="grid"><div class="card"><b>多层知识树</b><p>从回答中继续分叉、追问和整理知识。</p></div><div class="card"><b>智能体工具</b><p>基于 FastAPI、LangGraph 与可扩展工具链。</p></div><div class="card"><b>现代 Web 界面</b><p>Next.js 前端与流式交互体验。</p></div></div><a class="btn" href="https://github.com/Singapor876/threadscape">查看源码</a><a class="btn" href="https://github.com/Singapor876/threadscape#readme">部署说明</a><div class="note">这是在线项目展示页。完整对话功能需要部署后端，并配置你自己的模型 API Key。</div></section></main></body></html>
